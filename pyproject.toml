[project]
name = "patchloop"
version = "0.1.0"
description = "A from-scratch coding agent that fixes failing tests inside a locked-down Docker sandbox."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic==2.1.0",
    "openai==3.37.0",
    "mcp==2.3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2", "pillow==13.0.0"]

[project.scripts]
patchloop = "patchloop.cli:main"
patchloop-mcp = "patchloop.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon and the patchloop images (make images)"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["toy_repo", "seed"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
